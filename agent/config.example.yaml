#     recursive: false
#     mode: local
#     debounce: 2.0
#
#   - path: "~/inbox"
#     run: "python ~/loom/scripts/transcode.py {path}"
#     mode: queue
#     target_tag: gpu      # let the GPU box do the heavy lifting

